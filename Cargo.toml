[package]
    name         ="only_torch"
    version      ="0.25.0"
    edition      ="2024"
    description  ="仿造pytorch的个人玩具（仍在构思，请勿使用）AI框架"
    repository   ="https://github.com/dbsxdbsx/only_torch"
    license      ="MIT"
    documentation="https://docs.rs/only_torch"
    categories   =["ai", "machine-learning", "tensor"]
    readme       ="README.md"
    exclude      =["target/*", ".vscode/*", ".github/*", "tests/*", "justfile"]

    keywords=["machine-learning", "logic", "AI", "torch", "NEAT"]

# Lint 政策（与 clippy 默认的三处刻意分歧，其余保持零警告纪律）：
# - upper_case_acronyms：GELU/SELU/SGD/MSE/BCE 等是领域标准名，且部分枚举已序列化进
#   基因/模型文件，改名破坏兼容。
# - too_many_arguments：Conv2d/ConvTranspose2d 等按 PyTorch 签名对齐本就 >7 参数，
#   演化内部 helper 同理；该 lint 的"设计味道"提示由 code review 承担。
# - type_complexity：主要是测试 fixture 的元组类型与图内部回调签名，抽 type alias
#   反而降低就地可读性。
[lints.clippy]
    upper_case_acronyms="allow"
    too_many_arguments ="allow"
    type_complexity    ="allow"

# 关闭 lib 目标的默认 libtest bench harness：
# 使 `cargo bench --benches -- --save-baseline <名>` 等 Criterion 参数可在
# 单次 cargo 调用中传给全部 bench 目标（libtest 不认识这些参数会直接报错）。
# Criterion 官方推荐配置；对 `cargo test` 无影响。
[lib]
    bench=false

# 快迭代运行档：RL 长训练等 release 运行走这里。thin LTO + 多 codegen unit + 增量编译，
# 单文件改动重编译从 ~1m30s（fat LTO + cg=1）降到十几秒；运行时代价见 bench 口径说明。
# 注意：profile 不随 crate 发布，只影响本仓库本地构建。
[profile.release]
    lto          ="thin"
    codegen-units=16
    incremental  =true
    strip        ="debuginfo"

# 测量档：Criterion（cargo bench 默认走 bench profile）与宏基准钉死旧 release 配置
# （fat LTO + 单 codegen unit + 无增量），保证历史 baseline 可比性不受上面放宽影响。
[profile.bench]
    inherits     ="release"
    lto          =true
    codegen-units=1
    incremental  =false

# Debug 模式优化：在保持可调试性的前提下提升运行速度
# opt-level=1 对本项目代码开启基本优化（循环优化、部分内联）
[profile.dev]
    opt-level=1

# 对所有依赖开启最大优化（仅影响本项目开发，不影响下游用户）
# 显著加速 debug 模式下的 CNN 等计算密集型测试
[profile.dev.package."*"]
    opt-level=3

[features]
    default=[]
    # BLAS 加速：Intel MKL（推荐 Intel CPU）
    # 用法：cargo build --features blas-mkl
    # 注：本地无 MKL 时会自动从 GitHub Container Registry 下载预编译二进制
    blas-mkl=["ndarray/blas", "dep:intel-mkl-src"]
    # BLAS 加速：OpenBLAS（跨平台备选）
    # 用法：cargo build --features blas-openblas
    blas-openblas=["ndarray/blas", "dep:openblas-src"]
    # 分配画像（诊断用，默认关）：全局计数 allocator 统计 alloc 次数/字节，
    # 配合 PROFILE 命名桶输出各阶段分配 delta。会替换 global allocator，
    # 仅在性能诊断时开启：cargo run --features alloc-profile ...
    alloc-profile=[]

[dependencies]
    # BLAS 后端（可选，通过 feature 启用）
    # lp64 = 32 位整型索引（与 ndarray/cblas-sys 兼容）
    # seq = 单线程（避免与 rayon 线程池冲突）
    intel-mkl-src={version="0.8", optional=true, default-features=false, features=[
        "mkl-static-lp64-seq",
    ]}
    openblas-src={version="0.10", optional=true, features=["static"]}

    # 代码重构
    enum_dispatch="0.3"
    strum        ={version="0.26", features=["derive"]} # 枚举遍历和元数据

    # 数值相关
    approx     ="*"
    num-traits ="*"
    num-derive ="*"
    num-integer="*"
    rand       ="^0.8"
    # ^0.17 与 pyo3 桥 `numpy 0.27.1` 依赖统一（其 ndarray 区间为 >=0.15,<=0.17，无需动 pyo3）。
    # 0.16.1 起含 BLAS 全布局派发（#1419，注意转置 GEMM 可能输出 F 序，见 tensor/ops/mat_mul.rs 守卫）；
    # 0.17 纯增量（ArrayRef / IxDyn dot / 数组级数学函数），BLAS 路径与 0.16.1 相同。
    # 0.17.0 因 use-after-free 被 yank，最低用 0.17.1+。
    ndarray={version="^0.17.1", features=["serde"]}

    # 错误处理
    thiserror="1"

    # （反）序列化
    serde     ={version="1.0", features=["derive"]}
    serde_json="1.0"
    bincode   ="1.3.3"

    # 从硬盘保存、加载
    # savefile       ="*"
    # savefile-derive="*"

    # 图像处理
    image    ="*"
    imageproc="*"
    # show-image = "0.13.1"
    # screenshots = "0.7.0"

    # 宏
    paste         ="1.0.5"
    trait_variable="*"

    # 数据加载
    flate2="1.0"  # gzip 解压
    dirs  ="5.0"  # 跨平台目录
    ureq  ="2.9"  # HTTP 下载（blocking）
    md-5  ="0.10" # MD5 校验（RustCrypto）

    # ONNX 模型互操作（零依赖 protobuf 解析/编码）
    onnx-rs="0.1"

    # 并行计算
    rayon="1.10" # 数据并行

    # Python 交互（强化学习 Gym 环境）
    # pyo3 与 rust-numpy 同属 PyO3 组织，0.28 起版本号同步发版，需成对升级。
    # 0.29 含两个 RustSec 安全修复（new_closure Sync 缺失、迭代器越界读）与多项 soundness 收紧；
    # 其破坏性变更集中在「写 Python 扩展模块」场景，本项目纯嵌入方向（auto-initialize）不受影响。
    # numpy 0.29 的 ndarray 区间为 >=0.15,<=0.17，与本项目 ndarray 0.17.2 兼容。
    pyo3 ={version="0.29", features=["auto-initialize"]}
    numpy="0.29"

[dev-dependencies]
    # statrs="^0.16.0"
    serial_test="3"                                        # pyo3 测试需要串行执行，避免 Python 模块导入竞争
    criterion  ={version="0.5", features=["html_reports"]}

